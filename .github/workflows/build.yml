
name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          if [ -f Mtz2Bak.zip ]; then
            unzip -o Mtz2Bak.zip
          fi
          echo "Java files found:"
          find . -name "*.java" -not -path "./.git/*"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Self-test converter core
        run: |
          mkdir -p build_selftest
          javac -encoding UTF-8 -d build_selftest app/src/main/java/com/mtz2bak/core/*.java ci/SelfTest.java
          java -cp build_selftest SelfTest

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install SDK packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mtz2Bak-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
